<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xwing Project Indonesia</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
    background: white;
    font-size: 20px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
}

/* GRID PRODUK */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: black;
    box-shadow: 0 5px 10px rgba(0,0,0,0.05);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.card h3 {
    margin: 10px;
    font-size: 16px;
}

.price {
    margin: 0 10px 10px;
    color: #c9a100;
}
</style>

</head>

<body>

<header>
    Xwing Project Indonesia
</header>

<div class="grid">

<!-- PRODUK 1 -->
<a href="product.html" class="card">
    <img src="swatch1.jpg">
    <h3>Jam Lego Swatch</h3>
    <div class="price">Start from Rp150.000</div>
</a>

<!-- PRODUK 2 -->
<a href="product-analog.html" class="card">
    <img src="analog.jpg">
    <h3>Jam Lego Analog</h3>
    <div class="price">Rp150.000</div>
</a>

<!-- PRODUK 3 -->
<a href="product-digital.html" class="card">
    <img src="digital.jpg">
    <h3>Jam Lego Digital</h3>
    <div class="price">Rp150.000</div>
</a>

</div>

</body>
</html>
